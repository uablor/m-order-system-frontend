    <!--
      Content Security Policy
      ────────────────────────────────────────────────────────────────────────
      script-src 'self'       → only scripts from THIS origin may execute;
                                blocks any injected <script> from another host
      connect-src 'self' …    → XHR/fetch/WebSocket only to our own origin
                                and the API server; nothing else can be called
      img-src  'self' data: blob: … → images from self, inline data URIs,
                                blob URLs (camera/canvas), and API server (product images)
      style-src 'self' 'unsafe-inline' → Ant Design Vue injects runtime styles
      font-src  'self' data:  → local fonts + base64 encoded fonts
      base-uri  'self'        → blocks <base href> injection
      form-action 'self'      → forms can only submit to our own origin

      NOTE: frame-ancestors is NOT listed here because browsers ignore that
      directive when delivered via <meta>. It is enforced via the HTTP response
      header Content-Security-Policy set in vite.config.ts (dev/preview) and
      in your production web-server config (nginx: add_header Content-Security-Policy).
      ────────────────────────────────────────────────────────────────────────
      http://localhost:4000 is replaced by Vite at build time from .env
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      connect-src 'self' http://localhost:4000;
      img-src 'self' data: blob: http://localhost:4000 https://*.r2.dev;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      base-uri 'self';
      form-action 'self';
    ">

    <!-- Prevent MIME-type sniffing attacks -->
